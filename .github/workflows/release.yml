name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe'
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer; found $($installer.Count)." }
          New-Item -ItemType Directory -Force release | Out-Null
          $name = 'Easy-Clipboard_0.1.0_x64-setup.exe'
          Copy-Item $installer.FullName "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -NoNewline -Encoding ascii "release/$name.sha256"
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/Easy-Clipboard_0.1.0_x64-setup.exe release/Easy-Clipboard_0.1.0_x64-setup.exe.sha256 --title "Easy Clipboard v0.1.0" --generate-notes
