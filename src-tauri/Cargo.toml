[package]
name = "easy-clipboard"
version = "0.1.0"
description = "A lightweight clipboard manager for Windows"
authors = ["Kyaru Momochi"]
edition = "2024"
rust-version = "1.96"

[lib]
name = "easy_clipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cap-std = "=4.0.2"
fs2 = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "png"] }
rusqlite = { version = "=0.40.1", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.11.1", features = [] }
unicode-segmentation = "=1.13.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
